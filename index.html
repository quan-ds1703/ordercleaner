<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OrderCleaner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>OrderCleaner</h1>

    <p class="subtitle">
        Simple order management for small businesses.
    </p>


    <!-- ===================== -->
    <!-- SIGN UP + LOGIN -->
    <!-- ===================== -->

    <section id="authSection">

        <h2>Create Account</h2>

        <form id="signupForm">

            <label>Email</label>

            <input
                type="email"
                id="signupEmail"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                minlength="6"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>


        <h2>Login</h2>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <p id="authMessage"></p>

    </section>


    <!-- ===================== -->
    <!-- ORDER APP -->
    <!-- ===================== -->

    <section
        id="appSection"
        style="display: none;"
    >

        <p>
            Logged in as:
            <strong id="loggedInEmail"></strong>
        </p>

        <button id="logoutButton">
            Logout
        </button>


        <h2 id="formTitle">
            Add New Order
        </h2>


        <form id="orderForm">

            <label>Customer Name</label>

            <input
                type="text"
                id="customer"
                required
            >


            <label>Product</label>

            <input
                type="text"
                id="product"
                required
            >


            <label>Quantity</label>

            <input
                type="number"
                id="quantity"
                min="1"
                required
            >


            <label>Price</label>

            <input
                type="number"
                id="price"
                min="0"
                step="0.01"
                required
            >


            <label>Delivery Date</label>

            <input
                type="date"
                id="deliveryDate"
            >


            <label>Status</label>

            <select id="status">

                <option value="New">New</option>

                <option value="Processing">
                    Processing
                </option>

                <option value="Paid">
                    Paid
                </option>

                <option value="Delivered">
                    Delivered
                </option>

            </select>


            <button
                type="submit"
                id="saveButton"
            >
                Save Order
            </button>


            <button
                type="button"
                id="cancelEditButton"
                style="display: none;"
            >
                Cancel Edit
            </button>

        </form>


        <p id="orderMessage"></p>


        <div class="dashboard">

            <div>

                <h3>Total Orders</h3>

                <p id="totalOrders">
                    0
                </p>

            </div>


            <div>

                <h3>Total Revenue</h3>

                <p id="totalRevenue">
                    $0.00
                </p>

            </div>

        </div>


        <h2>Orders</h2>


        <input
            type="text"
            id="searchInput"
            placeholder="Search customer or product..."
        >


        <select id="statusFilter">

            <option value="All">
                All Statuses
            </option>

            <option value="New">
                New
            </option>

            <option value="Processing">
                Processing
            </option>

            <option value="Paid">
                Paid
            </option>

            <option value="Delivered">
                Delivered
            </option>

        </select>


        <table>

            <thead>

                <tr>

                    <th>Customer</th>

                    <th>Product</th>

                    <th>Qty</th>

                    <th>Price</th>

                    <th>Total</th>

                    <th>Delivery</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="orderTableBody"></tbody>

        </table>

    </section>

</div>


<!-- Supabase library -->
<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- Our JavaScript -->
<script src="app.js"></script>

</body>

</html>
